[project]
name = "grid2op-scenario"
version = "0.1.0"
description = "Scenario generation and derivation for AI4RealNet large and small grids."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grid2op[chronix2grid]==1.10.5",
    "lightsim2grid==0.10.3",
    "tqdm==4.67.3",
    "setuptools<70",
    # transitive dependencies from grid2op
    "numpy<2",
    "pandas>=1.0.3,<3",
    # chronix2grid dependencies
    "l2rpn-baselines>=0.8.0",
    "pypsa==0.24.0",
    "numba>=0.65.0",
    "mip",
]

[tool.uv]
override-dependencies = [
    # more recent pandapower versions introduce breaking changes in grid2op
    "pandapower>=2.14,<3",
]
